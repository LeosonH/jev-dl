[project]
name = "jev-dl"
version = "0.1.0"
description = "Find a video with typesafe-computer-use (jev), download it with yt-dlp."
requires-python = ">=3.12"
dependencies = ["yt-dlp>=2025.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-dl = "jev_dl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_dl"]
